# Igiti Play staging only. The legacy game and commerce database are not touched.
databases:
  - name: igiti-play-db-staging
    databaseName: igiti_play_staging
    user: igiti_play_staging
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: igiti-play-api-staging
    runtime: node
    plan: starter
    region: frankfurt
    branch: feat/render-game-backend
    rootDir: platform/server
    buildCommand: npm install
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: igiti-play-db-staging
          property: connectionString
      - key: WEB_ORIGIN
        value: https://play.igiti.africa,http://localhost:5173
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ADMIN_EMAILS
        sync: false
