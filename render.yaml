# Igiti Play staging API only. Reuses the existing `mysql` private service/database.
# Set DATABASE_URL in the Render API service to the existing MySQL internal connection string.
services:
  - type: web
    name: igiti-play-api-staging
    runtime: node
    plan: free
    region: oregon
    branch: feat/platform-foundation
    rootDir: platform/server
    buildCommand: npm install && npx prisma generate
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        value: https://play.igiti.africa,http://localhost:5173
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ADMIN_EMAILS
        sync: false
